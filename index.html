  <body>
    <script>
      (() => {
        const key = "__sft_sw_cleanup_done_v2";
        try {
          if (localStorage.getItem(key) === "1") return;
        } catch {
          return;
        }
        const hasSw = "serviceWorker" in navigator;
        const hasCaches = "caches" in window;
        if (!hasSw && !hasCaches) return;
        (async () => {
          let cleaned = false;
          try {
            if (hasSw) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              if (registrations.length > 0) {
                cleaned = true;
                await Promise.all(registrations.map((r) => r.unregister()));
              }
            }
          } catch {}
          try {
            if (hasCaches) {
              const keys = await caches.keys();
              if (keys.length > 0) {
                cleaned = true;
                await Promise.all(keys.map((k) => caches.delete(k)));
              }
            }
          } catch {}
          try {
            localStorage.setItem(key, "1");
          } catch {}
          if (cleaned) {
            try {
              location.reload();
            } catch {}
          }
        })();
      })();
    </script>
    <script>
      (() => {
        const enabled = location.search.includes("debug=1");
        if (!enabled) return;

        const sessionId = "createcontext-undefined-chunk";
        const runId = "pre-fix";
        const ports = [7777, 7778, 7779, 7780, 7781, 7782, 7783, 7784, 7785, 7786];

        const postJson = (url, payload) => {
          try {
            void fetch(url, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=UTF-8" },
              body: JSON.stringify(payload),
              keepalive: true,
            }).catch(() => {});
          } catch {}
        };

        const send = (hypothesisId, msg, data) => {
          const payload = {
            sessionId,
            runId,
            hypothesisId,
            msg,
            ts: Date.now(),
            data: data ?? null,
          };
          ports.forEach((port) => postJson(`http://127.0.0.1:${port}/event`, payload));
        };

        send("A", "boot:html-loaded", {
          href: location.href,
          userAgent: navigator.userAgent,
        });

        window.addEventListener(
          "error",
          (event) => {
            send("A", "boot:error", {
              message: event?.message,
              filename: event?.filename,
              lineno: event?.lineno,
              colno: event?.colno,
              stack: event?.error?.stack,
            });
          },
          true,
        );

        window.addEventListener(
          "unhandledrejection",
          (event) => {
            const reason = event?.reason;
            send("A", "boot:unhandledrejection", {
              reason: reason?.message ?? String(reason ?? ""),
              stack: reason?.stack,
            });
          },
          true,
        );
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
